[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dual_autodiff"
version = "0.1.0"
description = "Automatic differentiation using dual numbers"
authors = [{name = "Xueqing Xu"}]
readme = "README.md"
requires-python = ">=3.9c"
dependencies = [
    "numpy>=1.20.0",
    "typing-extensions>=4.0.0",
    "pytest>=7.0.0",
    "sphinx>=4.0.0"
]

[project.optional-dependencies]
dev = [
    "black",
    "pylint",
    "pytest-cov",
    "mypy>=1.0.0" ,
    "sphinx-rtd-theme",
    "nbsphinx",
    "ipython",
    "jupyter"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=dual_autodiff"


[tool.cibuildwheel]
skip = ["*-win32", "*-win_amd64", "*-macosx_*", "pp*", "cp36-*", "cp37-*", "cp38-*", "cp39-*"]
build = ["cp310-manylinux_x86_64", "cp311-manylinux_x86_64"]

[tool.cibuildwheel.linux]
repair-wheel-command = ""